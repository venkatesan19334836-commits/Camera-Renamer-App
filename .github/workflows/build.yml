name: Build
on: [push, workflow_dispatch]

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev python3-dev gettext openjdk-17-jdk unzip

      - name: Build
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.37 kivy
          yes | buildozer -v android debug

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: Camera-Renamer-APK
          path: bin/*.apk
